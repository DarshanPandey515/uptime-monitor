[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; ── Daphne ASGI server ────────────────────────────────────────────────────────
[program:daphne]
command=daphne -b 0.0.0.0 -p 8000 core.asgi:application
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Background task worker ────────────────────────────────────────────────────
; --sleep=1  → poll the DB every 1 second for new tasks (matches your dev setup)
; --queue     is omitted so it processes ALL queues
[program:worker]
command=python manage.py process_tasks --sleep=1
directory=/app
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
