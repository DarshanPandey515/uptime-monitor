## render.yaml  –  Render Blueprint
## Commit this file to the root of your backend repo.
## On Render → "New Blueprint" → point to this repo → it auto-creates everything.

databases:
  - name: upmonitor-db
    databaseName: upmonitor
    user: upmonitor
    plan: free

services:
  - type: web
    name: upmonitor-api
    plan: free
    runtime: docker           # use our Dockerfile
    dockerfilePath: ./Dockerfile

    # Render sets PORT automatically; daphne is hardcoded to 8000 in supervisord.conf
    # so we override the health-check path only:
    healthCheckPath: /api/health/

    envVars:
      # ── Injected automatically by Render ──────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: upmonitor-db
          property: connectionString

      # ── You must fill these in on the Render dashboard ────────────────────
      - key: SECRET_KEY
        generateValue: true       # Render generates a secure random value

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        # Replace with your actual Render service domain after first deploy
        # e.g. upmonitor-api.onrender.com
        value: "your-service.onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        # Replace with your Vercel frontend URL
        # e.g. https://upmonitor.vercel.app
        value: "https://your-frontend.vercel.app"

      - key: EMAIL_HOST_USER
        value: "pandeydarshan61@gmail.com"   # move to dashboard secret after testing

      - key: EMAIL_HOST_PASSWORD
        value: ""                            # set this as a secret on the dashboard

      - key: DEFAULT_FROM_EMAIL
        value: "pandeydarshan61@gmail.com"

      # ── Optional: add REDIS_URL here if you ever add a Redis instance ─────
      # - key: REDIS_URL
      #   fromService:
      #     name: upmonitor-redis
      #     property: connectionString
